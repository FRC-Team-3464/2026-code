<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1240" viewBox="0 0 1280 1240" role="img" aria-labelledby="title desc">
<title id="title">Single-controller proposal — Option 1</title>
<desc id="desc">Proposed Xbox-style robot controller bindings. Not implemented. Full text equivalent is in the accompanying Markdown document.</desc>
<rect width="1280" height="1240" fill="#f8fafc"/>
<style>text{font-family:Arial,sans-serif;fill:#172033}.heading{font-size:28px;font-weight:bold}.body{font-size:17px}.small{font-size:15px}.button{font-size:19px;font-weight:bold;text-anchor:middle}</style>
<text x="35" y="45" class="heading">Single Controller — Option 1</text>
<text x="35" y="75" class="body">Preserve the existing unused single-controller layout</text>
<rect x="805" y="24" width="440" height="56" rx="9" fill="#fef3c7"/>
<text x="825" y="49" class="body" font-weight="bold">PROPOSED — awaiting team agreement</text>
<text x="825" y="69" class="small">Not the currently deployed button mapping</text>
<path d="M420 302 Q423 268 485 268 L795 268 Q857 268 860 302 L900 609 Q901 660 852 650 L771 566 L509 566 L428 650 Q379 660 380 609 Z" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
<rect x="440" y="230" width="90" height="48" rx="13" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="485.0" y="261.0" class="button">LT</text>
<rect x="750" y="230" width="90" height="48" rx="13" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="795.0" y="261.0" class="button">RT</text>
<rect x="435" y="288" width="100" height="36" rx="13" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="485.0" y="313.0" class="button">LB</text>
<rect x="745" y="288" width="100" height="36" rx="13" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="795.0" y="313.0" class="button">RB</text>
<rect x="572" y="365" width="44" height="28" rx="13" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="594.0" y="386.0" class="button">◁</text>
<rect x="664" y="365" width="44" height="28" rx="13" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="686.0" y="386.0" class="button">▷</text>
<circle cx="488" cy="411" r="43" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
<text x="488" y="418" class="button">LS</text>
<circle cx="740" cy="516" r="43" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
<text x="740" y="523" class="button">RS</text>
<path d="M525 477 H555 V497 H575 V527 H555 V547 H525 V527 H505 V497 H525 Z" fill="#64748b"/>
<circle cx="800" cy="354" r="22" fill="#facc15" stroke="#475569"/>
<text x="800" y="361" class="button">Y</text>
<circle cx="843" cy="397" r="22" fill="#f87171" stroke="#475569"/>
<text x="843" y="404" class="button">B</text>
<circle cx="800" cy="440" r="22" fill="#86efac" stroke="#475569"/>
<text x="800" y="447" class="button">A</text>
<circle cx="757" cy="397" r="22" fill="#93c5fd" stroke="#475569"/>
<text x="757" y="404" class="button">X</text>
<path d="M345 173.5 L465 399" stroke="#2563eb" stroke-width="2" fill="none"/>
<rect x="30" y="135" width="315" height="77" rx="9" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="43" y="158" class="body" font-weight="bold">Left stick</text>
<text x="43" y="181" class="small">Drive translation</text>
<path d="M345 275.5 L445 304" stroke="#b45309" stroke-width="2" fill="none"/>
<rect x="30" y="237" width="315" height="77" rx="9" fill="white" stroke="#b45309" stroke-width="2"/>
<text x="43" y="260" class="body" font-weight="bold">LB</text>
<text x="43" y="283" class="small">Hold: manual-adjustment modifier</text>
<path d="M345 377.5 L470 250" stroke="#15803d" stroke-width="2" fill="none"/>
<rect x="30" y="339" width="315" height="77" rx="9" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="43" y="362" class="body" font-weight="bold">LT</text>
<text x="43" y="385" class="small">Hold: outtake</text>
<path d="M345 479.5 L520 512" stroke="#2563eb" stroke-width="2" fill="none"/>
<rect x="30" y="441" width="315" height="77" rx="9" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="43" y="464" class="body" font-weight="bold">D-pad</text>
<text x="43" y="487" class="small">Without LB: swerve movement</text>
<text x="43" y="507" class="small">With LB: turret / hood adjustment</text>
<path d="M345 581.5 L590 380" stroke="#2563eb" stroke-width="2" fill="none"/>
<rect x="30" y="543" width="315" height="77" rx="9" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="43" y="566" class="body" font-weight="bold">Back / View</text>
<text x="43" y="589" class="small">Press: reset heading</text>
<path d="M935 173.5 L810 250" stroke="#15803d" stroke-width="2" fill="none"/>
<rect x="935" y="135" width="315" height="77" rx="9" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="948" y="158" class="body" font-weight="bold">RT</text>
<text x="948" y="181" class="small">Hold: intake</text>
<path d="M935 275.5 L830 305" stroke="#b45309" stroke-width="2" fill="none"/>
<rect x="935" y="237" width="315" height="77" rx="9" fill="white" stroke="#b45309" stroke-width="2"/>
<text x="948" y="260" class="body" font-weight="bold">RB</text>
<text x="948" y="283" class="small">Hold: automatic turret / hood aiming</text>
<text x="948" y="303" class="small">and flywheel spin-up</text>
<path d="M935 377.5 L865 420" stroke="#15803d" stroke-width="2" fill="none"/>
<rect x="935" y="339" width="315" height="77" rx="9" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="948" y="362" class="body" font-weight="bold">A / B</text>
<text x="948" y="385" class="small">A: hold to reverse indexer</text>
<text x="948" y="405" class="small">B: hold to feed balls</text>
<path d="M935 479.5 L778 371" stroke="#15803d" stroke-width="2" fill="none"/>
<rect x="935" y="441" width="315" height="77" rx="9" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="948" y="464" class="body" font-weight="bold">X / Y</text>
<text x="948" y="487" class="small">X: hold to retract intake</text>
<text x="948" y="507" class="small">Y: hold to deploy intake</text>
<path d="M935 581.5 L692 380" stroke="#2563eb" stroke-width="2" fill="none"/>
<rect x="935" y="543" width="315" height="77" rx="9" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="948" y="566" class="body" font-weight="bold">Start / Menu</text>
<text x="948" y="589" class="small">Press: swerve X-lock</text>
<path d="M740 559 V678" stroke="#2563eb" stroke-width="2"/>
<rect x="388" y="678" width="504" height="72" rx="9" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="408" y="703" class="body" font-weight="bold">Right stick</text>
<text x="408" y="729" class="small">Left/right: rotate robot. Up/down: unassigned.</text>
<rect x="30" y="775" width="1215" height="107" rx="10" fill="#fff7ed" stroke="#b45309"/>
<text x="48" y="800" dy="0" class="body">Hold LB + D-pad: left/right turns turret; up/down adjusts hood.</text>
<text x="48" y="800" dy="27" class="body">Swerve D-pad commands are suppressed during manual adjustment.</text>
<text x="48" y="800" dy="54" class="body">Release manual controls to stop movement; release/repress RB to resume automatic aiming.</text>
<text x="35" y="915" class="small">Blue: driving • Green: intake/feed • Orange: shooting • Gray: mixed/unassigned. Labels also identify each action.</text>
<rect x="30" y="949" width="1215" height="265" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="50" y="983" class="body" font-weight="bold">PIT TESTING — using this proposed layout</text>
<text x="50" y="1020" class="body">Swerve: D-pad without LB</text>
<text x="50" y="1054" class="body">Turret: hold LB + D-pad left/right</text>
<text x="50" y="1088" class="body">Hood: hold LB + D-pad up/down</text>
<text x="680" y="1020" class="body">Feed: hold B</text>
<rect x="665" y="1037" width="560" height="72" rx="8" fill="#fef3c7"/>
<text x="680" y="1063" class="body" font-weight="bold">Fixed-speed flywheel test: NOT ASSIGNED</text>
<text x="680" y="1089" class="small">A separate test binding / behavior still needs agreement.</text>
<text x="50" y="1150" class="body" font-weight="bold">RB still uses field position for automatic aiming — it is not a fixed-speed pit test.</text>
<text x="50" y="1184" class="body">No separate pit-mode switch is defined here. These controls remain proposals, not implemented code.</text>
</svg>