<rect x="30" y="775" width="1215" height="107" rx="10" fill="#fff7ed" stroke="#b45309" />
<text x="48" y="800" dy="0" class="body">Teleop: left stick drives; right stick rotates; D-pad requests swerve movement.</text>
<text x="48" y="800" dy="27" class="body">X resets heading on a fresh press. B requests X-lock; it is not a latched drive-disable.</text>
<text x="48" y="800" dy="54" class="body">Driving input can move the robot again after X-lock. Mechanisms use the operator controller.</text>
<text x="35" y="915" class="small">Blue: driving • Green: intake/feed • Orange: shooting • Gray: mixed/unassigned. Labels also identify each action.</text>
