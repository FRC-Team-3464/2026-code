<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580"><rect width="1100" height="100%" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#172b45}.title{font-size:25px;font-weight:bold}.label{font-size:19px;font-weight:bold}.small{font-size:16px}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2764a5"/></marker></defs><text x="30" y="42" class="title">First deployment connections</text><line x1="345" y1="190" x2="715" y2="190" stroke="#2764a5" stroke-width="3" marker-end="url(#arrow)"/><text x="530.0" y="178.0" text-anchor="middle" class="small">USB data cable</text><line x1="185" y1="370" x2="185" y2="265" stroke="#2764a5" stroke-width="3" marker-end="url(#arrow)"/><text x="185.0" y="305.5" text-anchor="middle" class="small"></text><line x1="890" y1="370" x2="890" y2="275" stroke="#2764a5" stroke-width="3" marker-end="url(#arrow)"/><text x="890.0" y="310.5" text-anchor="middle" class="small">Robot power</text><rect x="35" y="110" width="310" height="150" rx="12" fill="white" stroke="#2764a5" stroke-width="2"/><text x="53" y="142" class="label">Windows laptop</text><text x="53" y="172" class="small">WPILib VS Code + Driver Station</text><text x="53" y="197" class="small">USB-A or USB-C data connection</text><text x="53" y="222" class="small">Xbox plugs into this laptop</text><rect x="720" y="100" width="340" height="170" rx="12" fill="white" stroke="#2764a5" stroke-width="2"/><text x="738" y="132" class="label">roboRIO 2.0</text><text x="738" y="162" class="small">Laptop cable: square USB-B port</text><text x="738" y="187" class="small">USB-A host: robot peripherals</text><text x="738" y="212" class="small">Robot battery power required</text><rect x="35" y="370" width="310" height="105" rx="12" fill="white" stroke="#2764a5" stroke-width="2"/><text x="53" y="402" class="label">Xbox controller</text><text x="53" y="432" class="small">USB data cable to laptop</text><rect x="720" y="370" width="340" height="105" rx="12" fill="white" stroke="#2764a5" stroke-width="2"/><text x="738" y="402" class="label">Robot power system</text><text x="738" y="432" class="small">Battery → breaker → distribution</text><text x="30" y="556" class="small">Stationary setup only. Disable and remove the laptop tether before floor driving.</text></svg>